server {
    listen 80;
    listen [::]:80;
    server_name trixus.com.br www.trixus.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.trixus.com.br$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trixus.com.br;

    ssl_certificate /etc/letsencrypt/live/trixus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trixus.com.br/privkey.pem;

    return 301 https://www.trixus.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.trixus.com.br;

    ssl_certificate /etc/letsencrypt/live/trixus.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trixus.com.br/privkey.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
